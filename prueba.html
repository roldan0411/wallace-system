<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba de conexión — Wallace System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--fondo:#0f1218;--caja:#1a1e29;--texto:#f4f6f8;--gris:#8b93a3;--ok:#01c38e;--mal:#e74c3c;--esp:#e67e22;}
  body{font-family:system-ui,Arial,sans-serif;background:var(--fondo);color:var(--texto);margin:0;padding:24px 16px;line-height:1.6;}
  .caja{max-width:760px;margin:0 auto;}
  h1{font-size:22px;margin-bottom:4px;}
  h2{font-size:16px;margin:28px 0 4px;}
  .sub{color:var(--gris);font-size:14px;margin-bottom:24px;}
  .fila{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px;}
  .fila strong{text-align:right;word-break:break-word;}
  .ok{color:var(--ok);} .mal{color:var(--mal);} .esp{color:var(--esp);}
  input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:var(--caja);color:var(--texto);font-size:15px;margin-top:8px;}
  .btn{background:var(--ok);color:var(--fondo);border:none;padding:14px 22px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;width:100%;}
  .btn2{background:transparent;color:var(--ok);border:1px solid var(--ok);}
  #log{margin-top:20px;background:var(--caja);padding:16px;border-radius:10px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:280px;overflow-y:auto;}
  .aviso{margin-top:20px;padding:16px;border-radius:10px;font-size:14px;}
  .aviso.mal{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.4);}
  .aviso.ok{background:rgba(1,195,142,.12);border:1px solid rgba(1,195,142,.4);}
</style>
</head>
<body>
<div class="caja">
  <h1>Prueba de conexión</h1>
  <div class="sub">Revisa si Firebase responde y qué reglas de seguridad están publicadas. <strong>No escribe nada en la base.</strong></div>
  <div id="resultados"></div>

  <h2>Probar un inicio de sesión (opcional)</h2>
  <div class="sub" style="margin-bottom:0">Usa un usuario que ya haya entrado una vez a la versión nueva. Solo lee su perfil y cierra la sesión.</div>
  <input id="u" placeholder="usuario" autocomplete="off">
  <input id="p" type="password" placeholder="contraseña" autocomplete="off">
  <button class="btn" id="b-probar">Probar inicio de sesión</button>
  <button class="btn btn2" id="b-revisar">Volver a revisar</button>
  <div id="veredicto"></div>
  <div id="log"></div>
</div>

<script type="module" src="prueba.js"></script>
</body>
</html>
